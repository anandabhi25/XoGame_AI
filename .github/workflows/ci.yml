name: Verify MVP
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      - run: .venv/bin/ruff check backend tests/test_api.py scripts && .venv/bin/ruff format --check backend tests/test_api.py scripts
      - run: .venv/bin/python -m pytest -q
      - run: npm --prefix frontend run lint && npm --prefix frontend run format:check && npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" npx playwright test
        working-directory: frontend
